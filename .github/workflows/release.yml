name: 构建与发布

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布浏览器扩展
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 创建发布目录
        run: mkdir -p keys release

      - name: 构建扩展程序
        run: npm run build

      - name: 生成 zip 包
        run: |
          npm run zip
          # WXT 默认将 zip 输出到 .output/，复制到 release/ 以便随 GitHub Release 发布
          cp .output/*.zip release/ 2>/dev/null || true

      - name: 生成 CRX 包
        env:
          CRX_PRIVATE_KEY_2_0: ${{ secrets.CRX_PRIVATE_KEY_2_0 }}
        run: npm run pack:crx

      - name: 打包外置资源（站点图标 HD / OCR 离线包）
        run: |
          npm run pack:icons
          npm run pack:ocr

      - name: 上传构建产物 (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            release/*.zip
            release/*.crx

      - name: 生成版本更新说明
        id: release_notes
        run: |
          # 版本号来自 package.json
          version=$(node -p "require('./package.json').version")
          echo "Detected version from package.json: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # 无独立 CHANGELOG 时，使用最近一次提交说明作为发布说明
          notes=$(git log -1 --pretty=%s 2>/dev/null || echo "Release $version")
          if [ -z "$notes" ]; then
            notes="Release $version"
          fi

          echo "$notes" > release_notes.md

          # 补充外置资源包说明（附件路径基于仓库根，未包含实际版本号）
          cat >> release_notes.md <<'EOF'
          ## 附带外置资源包

          本 Release 额外附带外置资源包（体积较大，不随扩展安装包分发，按需下载后导入扩展）：

          - `mp-site-icons-hd.zip` — 站点高清图标包，可在扩展「站点管理」中导入。
          - `mp-ocr-offline-*.zip` — 离线 OCR 资源包（ONNX Runtime WASM + 识别模型），可在扩展「设置 → 离线 OCR」中导入。

          EOF
          echo "Generated release notes:"
          echo "$notes"

      - name: 创建 GitHub Release 发布版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_notes.outputs.version }}
          name: MoviePilot Tools v${{ steps.release_notes.outputs.version }}
          body_path: release_notes.md
          files: |
            release/*.zip
            release/*.crx
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
